<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallium | Agent State Editor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="css/agent_editor.css" rel="stylesheet">
</head>

<body>
    <div id="toolbar">
        <button class="tool-btn" title="Add State" onclick="agentEditor.addState()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            Add State
        </button>
        <button class="tool-btn" id="btn-connect" title="Connect States" onclick="agentEditor.toggleLinkMode()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
            Connect
        </button>
        <div class="separator"></div>
        <button class="tool-btn" title="Undo" onclick="agentEditor.undo()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 7v6h6"></path>
                <path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"></path>
            </svg>
        </button>
        <button class="tool-btn" title="Redo" onclick="agentEditor.redo()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 7v6h-6"></path>
                <path d="M3 17a9 9 0 019-9 9 9 0 016 2.3L21 13"></path>
            </svg>
        </button>
        <div class="separator"></div>
        <span style="font-size:13px; color:var(--text-secondary);">Agent:</span>
        <input type="text" id="agent-name-input" class="agent-name-input" placeholder="Agent Name..."
            onchange="agentEditor.save()">
        <div style="flex:1"></div>
        <button class="tool-btn" style="color:#f44336;" title="Delete Agent" onclick="agentEditor.deleteCurrentAgent()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
        </button>
    </div>

    <div id="main-layout">
        <div id="sidebar">
            <div class="sidebar-header">
                <span>AGENTS</span>
                <button class="icon-btn" title="New Agent" onclick="agentEditor.createNewAgent()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <div id="agent-list">
                <!-- Agents populated here -->
            </div>
        </div>

        <div id="editor-container">
            <canvas id="agent-canvas"></canvas>
        </div>
    </div>

    <div id="properties-panel">
        <div class="panel-header">State Properties</div>
        <div id="properties-content">
            <div class="empty-state">Select a state to edit properties</div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu">
        <div class="menu-item" id="ctx-add-state">Add State</div>
        <div class="menu-item" id="ctx-connect">Connect</div>
        <div class="menu-item" id="ctx-delete">Delete</div>
    </div>

    <script src="js/agent_editor.js"></script>
</body>

</html>
