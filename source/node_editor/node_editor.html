<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallium | Decision Tree Editor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="css/node_editor.css" rel="stylesheet">
</head>

<body>

    <div id="toolbar">
        <button class="tool-btn" title="Add Node" onclick="showAddMenu(event)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
        <button class="tool-btn" title="Undo (Ctrl+Z)" onclick="graph.undo()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 7v6h6"></path>
                <path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"></path>
            </svg>
        </button>
        <button class="tool-btn" title="Redo (Ctrl+Shift+Z)" onclick="graph.redo()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 7v6h-6"></path>
                <path d="M3 17a9 9 0 019-9 9 9 0 016 2.3L21 13"></path>
            </svg>
        </button>
        <div style="width: 1px; height: 24px; background: var(--node-border); margin: 0 4px;"></div>
        <button class="tool-btn" title="Save Graph (.graph)" onclick="graph.saveToFile()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
        </button>
        <button class="tool-btn" title="Load Graph" onclick="graph.triggerLoad()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        </button>
        <div style="width: 1px; height: 24px; background: var(--node-border); margin: 0 4px;"></div>
        <button class="tool-btn" title="Recenter" onclick="graph.recenter()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 3h6v6M9 21H3v-6M21 15v6h-6M3 9V3h6"></path>
            </svg>
        </button>
        <button class="tool-btn" title="Zoom In" onclick="graph.zoom(1.1)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="11" y1="8" x2="11" y2="14"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
        </button>
        <button class="tool-btn" title="Reset Zoom" onclick="graph.resetZoom()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </button>
        <button class="tool-btn" title="Zoom Out" onclick="graph.zoom(0.9)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
        </button>
    </div>

    <div id="editor-container" oncontextmenu="return false;">
        <div id="graph-layer">
            <div id="nodes-layer">
                <!-- Nodes will be rendered here -->
            </div>
            <svg id="svg-layer">
                <!-- Connections will be rendered here -->
            </svg>
        </div>
    </div>

    <div id="minimap">
        <div id="minimap-content"></div>
        <div id="minimap-viewport"></div>
    </div>

    <div id="notification-area"></div>
    <input type="file" id="file-input" accept=".graph" style="display: none;" onchange="graph.loadFromFile(this)">

    <div id="status-bar">
        <span>Nodes: <span id="node-count">0</span></span>
        <select id="connection-style-select">
            <option value="curve">Curve</option>
            <option value="circuit">Circuit</option>
            <option value="straight">90 Deg</option>
        </select>
        <span>Zoom: <span id="zoom-level">100%</span></span>
        <span>Pos: <span id="view-pos">0, 0</span></span>
        <span><span class="kbd">Shift + Left Drag</span> Select Multiple</span>
        <span><span class="kbd">RMB</span> Context Menu</span>
    </div>

    <div id="function-panel">
        <div class="panel-section">
            <div class="panel-header">Function</div>
            <select id="function-selector"
                style="width: 100%; margin-bottom: 10px; padding: 6px; background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--node-border); border-radius: 4px;">
                <!-- Populated by JS -->
            </select>
            <div style="display: flex; gap: 4px; margin-bottom: 10px;">
                <button class="tool-btn" style="flex: 1; font-size: 11px;" onclick="funcManager.createNewFunction()">+
                    New</button>
                <button class="tool-btn" style="flex: 1; font-size: 11px; color: var(--danger);"
                    onclick="funcManager.deleteCurrentFunction()">Delete</button>
            </div>

            <label class="panel-label">Name</label>
            <input type="text" id="func-name" class="panel-input">

            <label class="panel-label">Description</label>
            <textarea id="func-desc" class="panel-textarea"></textarea>

            <div id="func-tags" class="tags-container"></div>
        </div>

        <div class="panel-section">
            <div class="panel-header">Inputs</div>
            <div id="func-inputs-list" class="io-list"></div>
        </div>

        <div class="panel-section">
            <div class="panel-header">Outputs</div>
            <div id="func-outputs-list" class="io-list"></div>
        </div>
    </div>

    <div id="context-menu">
        <div class="window-header" id="menu-header">
            <span>Add Node</span>
            <span class="window-close" onclick="graph.closePalette()">✕</span>
        </div>
        <div class="search-container">
            <input type="text" id="node-search" placeholder="Search nodes..." autocomplete="off">
        </div>
        <div class="palette-content" id="palette-list">
            <!-- Categories and nodes will be rendered here -->
        </div>
    </div>

    <script src="js/node_registry.js"></script>
    <script src="js/function_system.js"></script>
    <script src="js/node_graph.js"></script>
    <script src="js/graph_canvas.js"></script>
    <script src="js/graph_nodes.js"></script>
    <script src="js/graph_connections.js"></script>
    <script src="js/graph_persistence.js"></script>
    <script src="js/graph_history.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
